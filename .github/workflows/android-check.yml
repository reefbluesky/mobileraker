# Teste temporario: so verifica se o Android compila. NAO faz parte do PR.
name: Android check
on:
  push:
    branches: [android-check]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Arquivos falsos de Firebase e chave descartavel
        run: |
          K="AIzaSy$(printf 'A%.0s' $(seq 1 33))"
          mkdir -p mobileraker_pro/lib
          cat > mobileraker_pro/lib/firebase_options.dart <<DART
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  throw UnsupportedError('x');
              }
            }
            static const FirebaseOptions android = FirebaseOptions(apiKey: '$K', appId: '1:000000000000:android:0000000000000000', messagingSenderId: '000000000000', projectId: 'mobileraker-local-dev');
            static const FirebaseOptions ios = FirebaseOptions(apiKey: '$K', appId: '1:000000000000:ios:0000000000000000', messagingSenderId: '000000000000', projectId: 'mobileraker-local-dev', iosBundleId: 'com.ios.mobileranker');
          }
          DART
          sed -i 's/^          //' mobileraker_pro/lib/firebase_options.dart
          cat > android/app/google-services.json <<JSON
          {"project_info":{"project_number":"000000000000","project_id":"mobileraker-local-dev","storage_bucket":"mobileraker-local-dev.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.mobileraker.android.lite"}},"oauth_client":[],"api_key":[{"current_key":"$K"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
          sed -i 's/^          //' android/app/google-services.json
          keytool -genkeypair -keystore android/ci.jks -alias ci -keyalg RSA -keysize 2048 -validity 2 -storepass cipass123 -keypass cipass123 -dname "CN=ci"
          printf 'storePassword=cipass123\nkeyPassword=cipass123\nkeyAlias=ci\nstoreFile=../ci.jks\n' > android/key.properties
      - name: Dependencias e codigo gerado
        run: |
          flutter pub get
          (cd common && flutter pub get && dart run build_runner build --delete-conflicting-outputs)
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib common/lib mobileraker_pro/lib
      - name: Build APK release
        run: flutter build apk --release
